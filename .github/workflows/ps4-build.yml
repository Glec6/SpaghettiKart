name: Build PS4 Homebrew PKG

on:
  push:
    branches: [ feature/ps4-openorbis-port, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ps4:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake zip \
            pacman-package-manager makepkg libarchive-tools autoconf libtool nasm curl

      - name: Install PS4 Toolchain
        run: |
          sudo tee -a /etc/pacman.conf > /dev/null <<EOF
          [pacbrew]
          SigLevel = Optional TrustAll
          Server = https://pacman.mydedibox.fr/pacbrew/packages/
          EOF
          sudo pacman -Syu --noconfirm
          sudo pacman -S --noconfirm ps4-openorbis ps4-openorbis-portlibs

      - name: Fix missing GLES2 headers
        run: |
          sudo mkdir -p /opt/pacbrew/ps4/openorbis/usr/include/GLES2
          sudo tee /opt/pacbrew/ps4/openorbis/usr/include/GLES2/gl2platform.h > /dev/null << 'EOF'
          #ifndef __gl2platform_h_
          #define __gl2platform_h_

          #include <KHR/khrplatform.h>

          typedef khronos_intptr_t GLintptr;
          typedef khronos_ssize_t  GLsizeiptr;

          #endif
          EOF
          ls -l /opt/pacbrew/ps4/openorbis/usr/include/GLES2/gl2platform.h

      - name: Configure
        run: |
          mkdir -p cmake-build && cd cmake-build
          export OPENORBIS=/opt/pacbrew/ps4/openorbis
          cmake -G "Unix Makefiles" \
            -DPLATFORM_PS4=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-Wno-error -Wno-unknown-warning-option -Wno-format-truncation -Wno-restrict" \
            ..
    
      - name: Package PKG File
        run: |
          mkdir -p ps4_pkg/sce_sys
          cd ps4_pkg
          orbis-mksfo -title 'SpaghettiKart PS4' -id 'SPAG00064' sce_sys/param.sfo
          
          # Generate GP4 manifest dynamically
          cat << 'EOF' > proj.gp4
          <?xml version="1.0" encoding="utf-8"?>
          <ingame_project version="1">
            <volume>
              <volume_type>pkg_ps4_app</volume_type>
              <volume_id>SpaghettiKart</volume_id>
              <volume_ts>2026-08-01 00:00:00</volume_ts>
              <package_app_type>full</package_app_type>
              <content_id>IV0000-SPAG00064_00-SPAGHETTIKARTPS4</content_id>
              <title_id>SPAG00064</title_id>
            </volume>
            <files img_max_size="0">
              <file orig_path="../build_ps4/eboot.bin" target_path="eboot.bin" />
              <file orig_path="sce_sys/param.sfo" target_path="sce_sys/param.sfo" />
            </files>
          </ingame_project>
          EOF

          orbis-pub-cmd img_projectdata --costum_sys_ver "05050000" --proj_path proj.gp4
          orbis-pub-cmd img_create proj.gp4 ../SpaghettiKart_PS4.pkg

      - name: Upload Finished PKG to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SpaghettiKart-PS4-PKG
          path: SpaghettiKart_PS4.pkg
